<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f7931a"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)" stroke="#e94560" stroke-width="2"/>
  <!-- Dojo gate / Torii arch -->
  <path d="M30 30 L30 100 Q30 110 40 110 L50 110 L50 70 L78 70 L78 110 L88 110 Q98 110 98 100 L98 30 L64 12 Z"
        fill="url(#gate)" stroke="#f7931a" stroke-width="1"/>
  <!-- Inner gate opening -->
  <rect x="54" y="55" width="20" height="25" rx="2" fill="#0f3460"/>
  <!-- Bitcoin symbol inside gate -->
  <text x="64" y="74" font-family="Arial Black, sans-serif" font-size="18" font-weight="bold"
        fill="#f7931a" text-anchor="middle">₿</text>
  <!-- Pagoda roof curves -->
  <path d="M20 30 L64 10 L108 30" fill="none" stroke="#e94560" stroke-width="3"/>
  <!-- Star dots -->
  <circle cx="40" cy="40" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="88" cy="40" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="64" cy="98" r="1.5" fill="#fff" opacity="0.4"/>
</svg>
